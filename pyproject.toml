[project]
name = "todo-inmemory-cli"
version = "0.1.0"
description = "An in-memory todo console application"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "developer@example.com"}
]

[project.scripts]
todo = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"